<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">M∀b◇R◆sh/ — Maboroshi Works</title>
  <desc id="desc">A dark atmospheric banner where the name rapidly cycles through random glyphs, then resolves one character at a time from left to right among mist and drifting red petals.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset=".5" stop-color="#202b36"/>
      <stop offset="1" stop-color="#101721"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#d9e0dc" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#83969b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#83969b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#83969b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d7ddd7" stop-opacity=".58"/>
      <stop offset="1" stop-color="#83969b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="384" rx="3"/></clipPath>
  </defs>

  <style>
    .mist { animation: mist 20s ease-in-out infinite alternate; }
    .mist.back { animation-duration: 29s; animation-direction: alternate-reverse; }
    .thread { stroke-dasharray: 3 11; animation: trace 9s linear infinite; }
    .spark { animation: flicker 4.5s ease-in-out infinite; }
    .spark:nth-child(2n) { animation-delay: -2.1s; }
    .petal-a { animation: petalA 13s ease-in-out infinite; }
    .petal-b { animation: petalB 16s ease-in-out -7s infinite; }
    .petal-c { animation: petalC 18s ease-in-out -11s infinite; }
    .petal-d { animation: petalB 15s ease-in-out -3s infinite; }
    .name-stable { animation: stableName 16s linear infinite; }
    .decode-frame { opacity: 0; animation: decodeFrame 16s linear infinite; }
    .f01 { animation-delay: 13.28s; }
    .f02 { animation-delay: 13.46s; }
    .f03 { animation-delay: 13.64s; }
    .f04 { animation-delay: 13.82s; }
    .f05 { animation-delay: 14.00s; }
    .f06 { animation-delay: 14.18s; }
    .f07 { animation-delay: 14.36s; }
    .f08 { animation-delay: 14.54s; }
    .f09 { animation-delay: 14.72s; }
    .f10 { animation-delay: 14.90s; }
    .f11 { animation-delay: 15.08s; }
    .f12 { animation-delay: 15.26s; }
    .f13 { animation-delay: 15.44s; }
    .f14 { animation-delay: 15.62s; }
    .f15 { animation-delay: 15.80s; }

    @keyframes mist { to { transform: translate(92px,-8px); } }
    @keyframes trace { to { stroke-dashoffset: -140; } }
    @keyframes flicker { 50% { opacity: .18; transform: scale(.65); } }
    @keyframes petalA { 50% { transform: translate(38px,18px) rotate(28deg); } }
    @keyframes petalB { 50% { transform: translate(-31px,25px) rotate(-36deg); } }
    @keyframes petalC { 50% { transform: translate(22px,-18px) rotate(42deg); } }
    @keyframes stableName { 0%,82.9%,100% { opacity: 1; } 83%,99.9% { opacity: 0; } }
    @keyframes decodeFrame { 0%,1.15% { opacity: 1; } 1.18%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .name-stable { opacity: 1 !important; }
      .decode-frame { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="600" cy="204" rx="330" ry="185" fill="url(#halo)" filter="url(#blur24)"/>

    <g class="mist back" fill="none" stroke="#83969b" stroke-opacity=".08" stroke-width="38" filter="url(#blur24)">
      <path d="M-170 112C118 40 314 171 526 110S938 49 1380 121"/>
      <path d="M-220 347C82 270 310 380 604 312S1012 253 1400 338"/>
    </g>
    <g class="mist" fill="none" stroke="#e7e3d8" stroke-opacity=".07" stroke-width="17" filter="url(#blur24)">
      <path d="M-180 235C121 174 337 276 587 229S1009 169 1380 241"/>
    </g>

    <g fill="none" stroke-linecap="round">
      <path class="thread" d="M98 251C279 64 844 54 1094 249" stroke="url(#thread)" stroke-width="1"/>
      <path class="thread" d="M184 301C410 379 794 365 1018 285" stroke="#83969b" stroke-opacity=".25" stroke-width="1"/>
      <path d="M350 202H850" stroke="#e7e3d8" stroke-opacity=".08"/>
      <path d="M600 76V330" stroke="#83969b" stroke-opacity=".06"/>
    </g>

    <g fill="#b6474d" opacity=".72">
      <path class="petal-a" d="M142 78C153 65 169 69 172 82C163 96 149 101 138 91C144 87 146 83 142 78Z"/>
      <path class="petal-b" d="M252 302C263 289 280 293 283 307C274 320 260 325 249 315C255 311 257 307 252 302Z"/>
      <path class="petal-c" d="M908 83C919 70 936 74 939 88C930 101 916 106 905 96C911 92 913 88 908 83Z"/>
      <path class="petal-d" d="M1060 307C1071 294 1088 298 1091 312C1082 325 1068 330 1057 320C1063 316 1065 312 1060 307Z"/>
    </g>

    <g fill="#d9d4c5" opacity=".52">
      <circle class="spark" cx="284" cy="149" r="1.7"/>
      <circle class="spark" cx="389" cy="89" r="1.2"/>
      <circle class="spark" cx="820" cy="106" r="1.5"/>
      <circle class="spark" cx="927" cy="273" r="1.8"/>
      <circle class="spark" cx="336" cy="292" r="1.4"/>
    </g>

    <g text-anchor="middle">
      <text x="600" y="101" fill="#aebabc" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="7">MABOROSHI WORKS · 幻影工房</text>

      <g text-anchor="start" fill="#e7e3d8" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="9" filter="url(#softGlow)">
        <text class="name-stable" x="350" y="224">M∀b◇R◆sh/</text>
        <text class="decode-frame f01" x="350" y="224">Σ#Ъ△ЯΦṢН/</text>
        <text class="decode-frame f02" x="350" y="224">Ж∀7◈R§λ?/</text>
        <text class="decode-frame f03" x="350" y="224">MΔb×Я◆5h|</text>
        <text class="decode-frame f04" x="350" y="224">/◆RΣb∀M◇h</text>
        <text class="decode-frame f05" x="350" y="224">Φ∀b□Я◇sН/</text>
        <text class="decode-frame f06" x="350" y="224">M?Ъ◇R#ѕh/</text>
        <text class="decode-frame f07" x="350" y="224">M?Ъ△Я◇ṢН/</text>
        <text class="decode-frame f08" x="350" y="224">M∀?△Я◇ṢН/</text>
        <text class="decode-frame f09" x="350" y="224">M∀b?Я◇ṢН/</text>
        <text class="decode-frame f10" x="350" y="224">M∀b◇?◇ṢН/</text>
        <text class="decode-frame f11" x="350" y="224">M∀b◇R?ṢН/</text>
        <text class="decode-frame f12" x="350" y="224">M∀b◇R◆?Н/</text>
        <text class="decode-frame f13" x="350" y="224">M∀b◇R◆s?/</text>
        <text class="decode-frame f14" x="350" y="224">M∀b◇R◆sh?</text>
        <text class="decode-frame f15" x="350" y="224">M∀b◇R◆sh/</text>
      </g>

      <text x="600" y="282" fill="#aebabc" font-family="Arial, sans-serif" font-size="10" letter-spacing="5">GAME DEVELOPMENT · 3D ART · WORLDBUILDING</text>
      <text x="600" y="321" fill="#d3cbc0" fill-opacity=".68" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" letter-spacing="2">where illusion takes form</text>
    </g>
  </g>

  <rect x="18.5" y="18.5" width="1163" height="383" rx="3" fill="none" stroke="#83969b" stroke-opacity=".28"/>
  <path d="M18 58V18H58M1142 18H1182V58M1182 362V402H1142M58 402H18V362" fill="none" stroke="#e7e3d8" stroke-opacity=".42"/>
  <g fill="#b6474d" opacity=".62">
    <circle cx="63" cy="63" r="2"/><circle cx="1137" cy="357" r="2"/>
  </g>
</svg>
